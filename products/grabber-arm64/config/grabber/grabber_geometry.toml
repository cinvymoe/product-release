# 抓料机几何参数 (grabber geometry)
#
# 参考姿态 8 个现场测量值 + 油缸铭牌 + 物料重心偏移
# 注意:以下测量值均为占位,现场测量录入 —— 录入真实卷尺值后重启,参考姿态自动重解
# 非法几何(三角形不成立、asin/acos 越域、零/负长度)会被拒绝并报具名错误,不产生部分写入

# 物料重心相对抓头尖端偏移 (米,默认 0;顶层键,必须置于首个 [表头] 之前)
grab_offset_m = 0.0

# 行程百分比满量程 (毫米,默认 720.0;≤0 时 stroke_pct 按 0 处理;顶层键)
stroke_max_mm = 720.0

# ========== 参考姿态测量值 (M1–M8,单位:米,现场测量录入) ==========
[measurement]
# M1 原点 O(主臂根部回转中心)离地基准高度
h_root_m = 2.0
# M2 抓头尖端 G 离同一基准高度
h_grab_m = 3.5
# M3 参考姿态 O→G 直线距离
og_m = 6.8
# M4 主臂长 O→J
l_main_m = 5.0
# M5 折臂长 J→G
l_fold_m = 2.5
# M6 油缸下绞点 L→O 距离
d_low_m = 1.2
# M7 参考姿态油缸长 L→U
l_cyl_ref_m = 1.8
# M8 上绞点 U→O 距离(U 在主臂上)
d_up_m = 0.9

# ========== 油缸铭牌 (单位:米,现场测量录入) ==========
[cylinder]
# 缸径(无杆腔直径)
bore_m = 0.1
# 活塞杆直径
rod_m = 0.06
