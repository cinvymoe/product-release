# 正面吊报警配置: 过载阈值 + 取消滞回 + 去抖 + 角度区间 + 标定完整性
# 值须与 alarm-core 内嵌默认一致; 出厂阈值迁移自旧 crane alarm_thresholds.toml (moment 90/100, angle 0..85)。
[overload]
warning_pct = 90.0
danger_pct = 100.0
# 取消报警滞回带 (%): 触发后需 pct < 触发阈值 - clear_pct 才进入解除计数
clear_pct = 5.0

[debounce]
trigger_count = 5
clear_count = 10

[debounce.per_source.sensor_fault]
trigger_count = 1
clear_count = 1

[debounce.per_source.angle_out_of_range]
trigger_count = 3
clear_count = 5

# 大臂角度允许区间 (度); 越界 = AngleOutOfRange 报警
[angle]
min_deg = 0.0
max_deg = 85.0

# 标定完整性 (缺任一项 → CalibrationIncomplete / Warning)
[calibration]
require_angle = true
require_cylinder_geometry = true
require_load_chart = true
