# 折臂吊输出映射 (出厂): 安全态 + 报警→输出规则 (与 alarm-core DEFAULT_MAPPING_TOML 逐字一致)
[safe_state]
relay1 = false
relay2 = false
normal_light = true
warning_light = false
alarm_light = false
alarm_sound = false

[[mapping]]
source = "load_overload"
level = "warning"
activate = ["warning_light", "relay2", "alarm_sound"]
deactivate = ["normal_light"]

[[mapping]]
source = "load_overload"
level = "danger"
activate = ["alarm_light", "relay1", "relay2", "alarm_sound"]
deactivate = ["normal_light"]

[[mapping]]
source = "sensor_fault"
level = "critical"
activate = ["alarm_light", "alarm_sound"]
deactivate = ["normal_light"]
