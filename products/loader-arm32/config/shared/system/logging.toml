# 全局日志配置文件
# 
# 此文件用于控制应用程序的日志输出行为
# 可以为每个模块/文件单独设置日志级别

# 默认日志级别（可选值: trace, debug, info, warn, error, off）
default_level = "info"

# crane_algorithms 日志（AD转换、校准、力矩计算）
[[modules]]
module = "crane_algorithms"
level = "warn"

# crane_algorithms::calibration AD转换日志
[[modules]]
module = "crane_algorithms::calibration"
level = "warn"

# crane_algorithms::chassis_params 重量计算日志
[[modules]]
module = "crane_algorithms::chassis_params"
level = "warn"

# crane_algorithms::config 载荷表配置日志
[[modules]]
module = "crane_algorithms::config"
level = "warn"

# sensor_core 日志
[[modules]]
module = "sensor_core"
level = "error"

# sensor_core::calibration 校准日志
[[modules]]
module = "sensor_core::calibration"
level = "error"

# sensor_core::calibration::sensor_calibration
[[modules]]
module = "sensor_core::calibration::sensor_calibration"
level = "error"

# pipeline_application 日志
[[modules]]
module = "pipeline_application"
level = "error"

# pipeline_application::stages 日志
[[modules]]
module = "pipeline_application::stages"
level = "error"

# qt_rust_demo::reducers 日志
[[modules]]
module = "qt_rust_demo::reducers"
level = "warn"

# config_hot_reload 日志
[[modules]]
module = "config_hot_reload"
level = "warn"

# config_core 日志
[[modules]]
module = "config_core"
level = "warn"

# 是否输出到控制台
console_output = true

# 是否输出到文件
file_output = false

# SPI-ADC 数据源日志
[[modules]]
module = "sensor_core::source::factory"
level = "debug"

# 采集管道日志
[[modules]]
module = "qt_rust_demo::pipeline::collection_pipeline"
level = "debug"

# 日志文件路径（当 file_output = true 时生效）
log_file = "logs/app.log"

