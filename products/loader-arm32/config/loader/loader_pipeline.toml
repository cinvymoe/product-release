# 装载机管道配置 (loader pipeline)
#
# 包含采集、重试、存储、数据库等全部运行时参数
# 修改后重启生效

# ========== 数据源配置 ==========
[data_source]
# 数据源类型: "mock" (本地开发) | "hardware" (SPI ADC + GPIO)
type = "hardware"
# 以下仅 type="hardware" 时需要，路径相对于 config/ 目录
gpio_config = "sensors/loader_gpio_input_config.toml"
spi_config = "sensors/loader_spi_adc_config.toml"

# ========== 采集配置 ==========
[collection]
# 已固化到代码 (hardcoded 5, 不从配置读取, 兼容保留键仅为旧文件解析不报错)
# 5ms × 滤波窗口 5 = 25ms 滤波帧 cadence; 速度 800 驻留 125ms 采 5 帧 ≥ min_weighing_samples=3, 高速过区不被拒称
interval_ms = 5
# 初始序列号
initial_sequence = 0

# ========== 重试策略 ==========
[retry]
# 单次采集失败最大重试次数
max_retries = 3

# 重试间隔（毫秒）
retry_delay_ms = 100

# 连续失败断连阈值
disconnect_threshold = 5

# ========== 滤波配置 ==========
# trimmed mean 滤波：收集 window_size 个样本，排序后去首尾各 1/3，取中间 1/3 平均
# 参照 STM32 loader-scales Collect_data() 算法
[filter]
# 是否启用滤波（false = 直通，向后兼容）
enabled = true
# 已固化到代码 (hardcoded 5, 不从配置读取, 兼容保留键仅为旧文件解析不报错)
# 滤波窗口 5: 与采集间隔联动约束 5ms×5=25ms cadence, 驻留(100000/速度) ÷ cadence ≥ 3, 出厂须支持速度 800
window_size = 5
# EMA 第二级平滑系数（缺省注释掉 = 单级 trimmed-mean）。
# 作用于 trimmed-mean 输出帧率（5ms×5 = 40Hz）；取值 (0.0, 1.0]，越小越平滑。
ema_alpha = 0.4

# ========== 存储管道配置 ==========
[storage]
# 是否启用 SQLite 存储 (false = 仅采集不持久化; 总开关, 门控下方所有 stage)
enabled = true

# 批量刷盘大小（累积 N 条自动写入 SQLite; 各 stage 可单独覆盖）
batch_size = 50

# ── 分 stage 存储开关 (四张表, 独立控制) ──
# 每个 stage 可单独开关存储并覆盖 batch_size (缺省沿用上方 batch_size)
# 生效条件: [storage].enabled && [storage.<stage>].enabled 均为 true

[storage.collection]
# 采集 stage: 原始 (滤波前) 数据 → loader_raw_data 表
# 与滤波 stage 存储并行独立; 滤波开启时两者可同时写 (写入量约 2 倍)
# 注意: enabled 已失效 — 生产采集改由「设置 → 采集记录」界面开关热挂载控制，
#       启动时不再静态挂载（键保留仅为解析兼容）；batch_size / max_rows 继续生效。
enabled = false
# batch_size = 50
# 行数上限保留: loader_raw_data 最多保留 100,000 行, 超出由 writer 自动清理。
# 注: 当前 collection 存储关闭, 若后续启用则保留策略自动生效
max_rows = 100000

[storage.filter]
# 滤波 stage: 滤波后数据 → loader_filtered_data 表 (仅 filter.enabled = true 时挂载)
# 注意: 关闭后滤波仍生效 ([filter].enabled 控制), 只是不存滤波后数据
# 注意: enabled 已失效 — 生产采集改由「设置 → 采集记录」界面开关热挂载控制，
#       启动时不再静态挂载（键保留仅为解析兼容）；batch_size / max_rows 继续生效。
enabled = false
# batch_size = 50
# 行数上限保留: loader_filtered_data 最多保留 100,000 行, 超出由 writer 自动清理。
# 注: 当前 filter 存储关闭, 若后续启用则保留策略自动生效
max_rows = 100000

[storage.processed]
# 处理 stage: 处理后数据 → loader_processed_data 表
# 注意: enabled 已失效 — 生产采集改由「设置 → 采集记录」界面开关热挂载控制，
#       启动时不再静态挂载（键保留仅为解析兼容）；batch_size / max_rows 继续生效。
enabled = true
# batch_size = 50
# 行数上限保留: loader_processed_data 最多保留 100,000 行,
# 超出部分由 writer 启动时 + 每小时自动清理 (按 sequence 保留最高一批)
max_rows = 100000

[storage.weighing]
# 称重记录 stage: 每斗完成时一条称重记录 → loader_weighing_records 表
# 低频写入 (每斗一条), 独立于处理 stage
enabled = true
# batch_size = 50
# 行数上限保留: loader_weighing_records 最多保留 100,000 行 (按 id 保留最新),
# 超出部分由 writer 自动清理
max_rows = 100000

# ========== 数据库配置 ==========
[database]
# SQLite 文件路径 (已迁至 rootfs /var/lib，避开 /userdata 只读卷)
path = "/var/lib/qt-rust-demo/loader_data.db"

# 是否启用 WAL 模式
enable_wal = false

# 生产数据库目录 (采集记录界面的生产数据会话文件目录; 缺省值与 pipeline_config.rs default_production_dir 一致)
production_dir = "/var/lib/qt-rust-demo/production"

# ========== 示例运行配置 ==========
# 仅 collection_storage_arm 示例使用
[demo]
# 运行时长（秒）
duration_secs = 60

# 油缸参数已迁至 loader_cylinder.toml (设备自治)
# 称重运行参数已迁至 loader_weighing.toml (设备自治)
# 分段标定/速度补偿为死配置, 真实标定数据见 loader_calibration.toml

# 打印参数已迁至 loader_printer.toml (设备自治机台文件, 推送不覆盖)
# MQTT 上传参数已迁至 loader_mqtt.toml (设备自治机台文件, 推送不覆盖)
